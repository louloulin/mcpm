version: '3.8'

services:
  # MCPM服务器
  mcpm:
    image: mcpm:latest
    container_name: mcpm-server
    restart: unless-stopped
    ports:
      - "5300:5000"
    environment:
      - DATABASE_URL=postgresql://mcpmuser:mcpmpassword@localhost:5432/mcpm
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=your-secret-key
      - JWT_EXPIRES_IN=7d
      - GLAMA_API_URL=https://api.glama.ai
      - GLAMA_API_KEY=your_glama_api_key
      - SYNC_INTERVAL=86400000
      - API_BASE_URL=/api/v1
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

