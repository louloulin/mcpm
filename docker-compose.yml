version: '3.8'

services:
  mcpm:
    build: .
    container_name: mcpm-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mcpm
      - DB_USER=mcpmuser
      - DB_PASSWORD=mcpmpassword
      - JWT_SECRET=your-secret-key
      - API_RATE_LIMIT=100
      - API_TIMEOUT=30000
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mcpm-network

  postgres:
    image: postgres:13-alpine
    container_name: mcpm-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mcpmuser
      - POSTGRES_PASSWORD=mcpmpassword
      - POSTGRES_DB=mcpm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpmuser -d mcpm"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcpm-network

  redis:
    image: redis:6-alpine
    container_name: mcpm-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mcpm-network

  prometheus:
    image: prom/prometheus:latest
    container_name: mcpm-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - mcpm-network

  grafana:
    image: grafana/grafana:latest
    container_name: mcpm-grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - mcpm-network

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  mcpm-network:
    driver: bridge 