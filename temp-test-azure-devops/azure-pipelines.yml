# Node.js
# Build and test Node.js project with npm.
trigger:
  - main
  - master
  
pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm ci
  displayName: 'Install dependencies'

- script: |
    npm test
  displayName: 'Run tests'
